name: Build and Push Docker Image

on:
  push:
    branches:
      - main
    paths:
      - 'backend/**'
      - 'frontend/**'
      - 'shared/**'
      - 'backend/Dockerfile'
      - '.github/workflows/docker-build-push.yml'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  OWNER: marcoslorcar

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Determine Docker tags
        id: meta
        run: |
          BRANCH_NAME="${GITHUB_REF_NAME}"
          # Replace unsafe characters (slashes, etc.) with dashes, and lowercase it
          SAFE_BRANCH=$(echo "${BRANCH_NAME}" | sed 's/[^a-zA-Z0-9._-]/-/g' | tr '[:upper:]' '[:lower:]')
          
          if [ "${SAFE_BRANCH}" = "main" ]; then
            echo "app_tags=${{ env.REGISTRY }}/${{ env.OWNER }}/infragest-app:latest,${{ env.REGISTRY }}/${{ env.OWNER }}/infragest-app:${{ github.sha }}" >> $GITHUB_OUTPUT
          else
            echo "app_tags=${{ env.REGISTRY }}/${{ env.OWNER }}/infragest-app:${SAFE_BRANCH},${{ env.REGISTRY }}/${{ env.OWNER }}/infragest-app:${{ github.sha }}" >> $GITHUB_OUTPUT
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: backend/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.app_tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Log in to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Update Azure Web App container image
        run: |
          az webapp config container set \
            --name "${{ secrets.AZURE_APP_NAME }}" \
            --resource-group "${{ secrets.AZURE_RESOURCE_GROUP }}" \
            --docker-custom-image-name "ghcr.io/${{ env.OWNER }}/infragest-app:${{ github.sha }}" \
            --docker-registry-server-url "https://ghcr.io" \
            --docker-registry-server-user "${{ github.actor }}" \
            --docker-registry-server-password "${{ secrets.GHCR_PAT }}"

      - name: Restart Azure Web App
        run: |
          az webapp restart \
            --name "${{ secrets.AZURE_APP_NAME }}" \
            --resource-group "${{ secrets.AZURE_RESOURCE_GROUP }}"
