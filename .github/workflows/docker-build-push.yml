name: Build and Push Docker Images

on:
  push:
    branches:
      - main
      - feature/major-refactoring-and-new-features

env:
  REGISTRY: ghcr.io
  OWNER: javierloro

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Build and push Backend Image
      - name: Build and push Backend image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: backend/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.OWNER }}/app-control-mantenimiento-backend:latest
            ${{ env.REGISTRY }}/${{ env.OWNER }}/app-control-mantenimiento-backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Build and push Frontend Image
      - name: Build and push Frontend image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: frontend/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.OWNER }}/app-control-mantenimiento-frontend:latest
            ${{ env.REGISTRY }}/${{ env.OWNER }}/app-control-mantenimiento-frontend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
