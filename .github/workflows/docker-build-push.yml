name: Build and Push Docker Image

on:
  push:
    branches:
      - main
    paths:
      - 'backend/**'
      - 'frontend/**'
      - 'shared/**'
      - 'backend/Dockerfile'
      - '.github/workflows/docker-build-push.yml'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  OWNER: marcoslorcar

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Determine Docker tags
        id: meta
        run: |
          BRANCH_NAME="${GITHUB_REF_NAME}"
          # Replace unsafe characters (slashes, etc.) with dashes, and lowercase it
          SAFE_BRANCH=$(echo "${BRANCH_NAME}" | sed 's/[^a-zA-Z0-9._-]/-/g' | tr '[:upper:]' '[:lower:]')
          
          if [ "${SAFE_BRANCH}" = "main" ]; then
            echo "app_tags=${{ env.REGISTRY }}/${{ env.OWNER }}/infragest-app:latest,${{ env.REGISTRY }}/${{ env.OWNER }}/infragest-app:${{ github.sha }}" >> $GITHUB_OUTPUT
          else
            echo "app_tags=${{ env.REGISTRY }}/${{ env.OWNER }}/infragest-app:${SAFE_BRANCH},${{ env.REGISTRY }}/${{ env.OWNER }}/infragest-app:${{ github.sha }}" >> $GITHUB_OUTPUT
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: backend/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.app_tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
